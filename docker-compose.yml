services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    environment:
      # Inside the compose network the DB host is "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/${POSTGRES_DB:-ecommerce}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      args:
        # Empty: the browser calls the API on the same host it opened the site on
        # (localhost on this PC, the PC's LAN IP from a phone)
        NEXT_PUBLIC_API_URL: ""
        # Local demo only: shows one-click admin/customer login on /login
        NEXT_PUBLIC_DEMO_LOGIN: "true"
    container_name: ecommerce-frontend
    restart: unless-stopped
    environment:
      # Used by server-side rendering (inside the container)
      API_INTERNAL_URL: http://backend:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  pgdata:
